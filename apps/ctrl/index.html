<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가지 CTRL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: 관제실 근무표 — 담담하고 정확하게. 이상한 것만 색으로 튄다
   IDEA: 발전소 계통도 옆의 상태 판 — 줄마다 '마지막 신호 몇 분 전'
   PICTURE: 맨 위 상태 판(판정 루프·마스터·실행기·수집기·Keeper)이 첫 화면의 그림
   COLOUR and TYPE: 가지 보라 하나 + 정상 초록·주의 호박·위험 빨강, IBM Plex Sans KR
   LAYOUT: 보호 모드 띠 → 상태 판 → 제어 → 점검·관리 일 */
:root{color-scheme:light dark;
  --bg:light-dark(#f6f4f8,#16121a);--sf:light-dark(#fff,#211b27);--ink:light-dark(#1f1a24,#ece6f1);--mu:light-dark(#685f72,#a99fb3);
  --ln:light-dark(#e2dce8,#382f40);--ac:light-dark(#5b2a6e,#c99be2);--acs:light-dark(#efe5f4,#33263c);
  --ok:light-dark(#2d7a48,#7ccb98);--oks:light-dark(#e2f2e7,#1d3326);--wa:light-dark(#975f00,#f2bb55);--was:light-dark(#fcefd6,#3a2d16);
  --ba:light-dark(#b0241c,#f48c84);--bas:light-dark(#fbe2df,#40201e);--te:light-dark(#255d9e,#8ab4f0);--tes:light-dark(#e2ebf8,#1e2a3c);
  --f:"IBM Plex Sans KR",system-ui,sans-serif;--m:"IBM Plex Mono",ui-monospace,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);overflow-x:clip}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:16px max(3vw,14px) 40px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:32px;line-height:1.05;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--mu);margin-top:6px}
h2{font-size:18px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sf);padding:8px 14px;min-height:40px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--sf);font-weight:600}
.btn{border:1px solid var(--ln);background:var(--sf);padding:9px 14px;min-height:44px;border-radius:8px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:focus-visible,.seg button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--sf);font-weight:600}
.btn.dan{background:var(--bas);color:var(--ba);border-color:transparent;font-weight:600}
.band{border-radius:10px;padding:14px 16px;margin-bottom:12px}
.band.test{background:var(--tes);color:var(--te);font-weight:600}
.band.prot{background:var(--ba);color:#fff}
.band.prot h2{color:#fff;font-size:20px}.band.prot code{background:rgb(255 255 255/.15);padding:1px 6px;border-radius:4px}
.band.prot ol{margin:8px 0 0;padding-left:20px}
.band.note{background:var(--was);color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-bottom:18px}
.cell{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;position:relative}
.cell .k{font-size:13px;color:var(--mu)}.cell .v{font-size:22px;font-weight:600;line-height:1.2;margin:4px 0}
.cell .s{font-size:13px;color:var(--mu);overflow-wrap:anywhere}
.cell::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--ln)}
.cell.ok::before{background:var(--ok)}.cell.wa::before{background:var(--wa)}.cell.ba::before{background:var(--ba)}
.cell.ok .v{color:var(--ok)}.cell.wa .v{color:var(--wa)}.cell.ba .v{color:var(--ba)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.pan{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px}
.ctl{border-top:1px solid var(--ln);padding:12px 0}.ctl:first-of-type{border-top:0;padding-top:0}
.ctl h3{font-size:15px;margin:0 0 4px}.ctl p{margin:0 0 10px;font-size:13.5px;color:var(--mu)}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12.5px;font-weight:500;background:var(--bg);color:var(--mu);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.wa{background:var(--was);color:var(--wa)}.pill.ba{background:var(--bas);color:var(--ba)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:13px}
.mono{font-family:var(--m);font-size:12.5px;overflow-wrap:anywhere}
.mu{color:var(--mu);font-size:13px}
.empty{color:var(--mu);font-size:13.5px;padding:8px 0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mu);margin:8px 0}
label.f select{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:9px;min-height:44px;font-size:16px}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);max-width:520px;width:calc(100% - 28px);padding:18px}
dialog::backdrop{background:rgb(20 10 25/.5)}dialog h3{margin:0 0 8px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sf);padding:9px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:calc(100% - 28px)}
@media(max-width:600px){h1{font-size:26px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:2px 0}.stack td::before{content:attr(data-l);color:var(--mu)}}
@media(prefers-reduced-motion:no-preference){.cell{transition:border-color .2s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>가지 CTRL<small id="sub">시스템 감시·제어 — 불러오는 중…</small></h1>
  <div class="bar">
    <div class="seg" role="group" aria-label="볼 폴더">
      <button type="button" id="env-prod" aria-pressed="true">운영</button>
      <button type="button" id="env-test" aria-pressed="false">시험</button>
    </div>
    <button class="btn" type="button" id="reload">새로고침</button>
  </div>
</header>

<div id="testband" class="band test" hidden>시험 폴더(eggplant_yolo_test)를 보고 있습니다. 여기서 보내는 신호는 시험 시스템에만 갑니다.</div>
<div id="prot" class="band prot" hidden></div>
<div id="note"></div>

<section class="board" id="board" aria-label="생존 신호"></section>

<div class="grid">
  <section class="pan" aria-labelledby="h-ctl">
    <h2 id="h-ctl">제어</h2>
    <label class="f"><span>보내는 사람 (사람 목록 people.json — 실제 확인은 파일을 만든 Google 계정으로 함)</span><select id="who"></select></label>
    <div class="ctl"><h3>마스터 깨우기</h3><p id="wake-desc">심판이 살아 있으면 쓸 수 없습니다. Keeper가 1분 안에 2차 확인을 하고 깨웁니다.</p>
      <button class="btn pri" type="button" id="act-wake">마스터 깨우기</button></div>
    <div class="ctl"><h3>정지</h3><p>새 배정을 멈춥니다. 확정 승인된 TASK는 끝까지 갑니다. 정지 중에는 자동 깨우기도 하지 않습니다.</p>
      <button class="btn dan" type="button" id="act-stop">정지 신호 보내기</button></div>
    <div class="ctl"><h3>정지 보류</h3><div id="holds" class="empty">–</div></div>
    <div class="ctl"><h3>보낸 신호 처리 결과</h3><div id="sigs" class="empty">–</div></div>
  </section>
  <section class="pan" aria-labelledby="h-chk">
    <h2 id="h-chk">점검</h2>
    <div id="check"></div>
    <h2 style="margin-top:16px">관리 일·학습</h2>
    <div id="runs"></div>
    <h2 style="margin-top:16px">알림</h2>
    <div id="alerts"></div>
  </section>
</div>
</div>

<dialog id="dlg" aria-labelledby="dlg-t"><h3 id="dlg-t"></h3><div id="dlg-b"></div>
  <div class="row"><button class="btn" type="button" id="dlg-no">닫기</button><button class="btn pri" type="button" id="dlg-ok">보내기</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
{
"use strict";
const DRIVE = "Google Drive", FOLDER = "application/vnd.google-apps.folder";
const ALIVE = 180, COLLECTOR_STALE = 1200, KEEPER_STALE = 300;
const S = { mcp: null, env: "prod", root: {}, admin: {}, d: {}, people: null, errors: [], at: 0, act: null,
  gen: 0, loadedEnv: null, dirs: null };   // gen: 읽기 세대 — 환경을 바꾸면 늘려 옛 읽기 결과·전송 대상을 버림 (b17 X2)
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const pill = (t, c) => `<span class="pill ${c || ""}">${esc(t)}</span>`;
function toast(m, ms = 5000) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms); }
const secOf = (v) => { if (v == null || v === "") return 0; if (typeof v === "number") return v > 1e12 ? v / 1000 : v; const d = Date.parse(v); return isNaN(d) ? 0 : d / 1000; };
const now = () => Date.now() / 1000;
function ago(sec) { if (!sec) return "기록 없음"; const s = Math.round(now() - sec); if (s < 60) return `${Math.max(0, s)}초 전`; const m = Math.round(s / 60); if (m < 90) return `${m}분 전`; const h = Math.round(m / 60); return h < 48 ? `${h}시간 전` : `${Math.round(h / 24)}일 전`; }
function kst(sec) { if (!sec) return ""; const k = new Date(sec * 1000 + 9 * 3600e3), p = (n) => String(n).padStart(2, "0"); return `${k.getUTCMonth() + 1}/${k.getUTCDate()} ${p(k.getUTCHours())}:${p(k.getUTCMinutes())}`; }
function errText(e) {
  const c = e && e.code;
  if (c === "needs_reauth") return "Google Drive 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 다시 연결하세요.";
  if (c === "server_not_connected") return "Google Drive 커넥터가 연결되어 있지 않습니다.";
  if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "이 페이지의 Google Drive 사용을 아직 허락하지 않았습니다. 다시 시도하면 허락을 묻습니다.";
  if (c === "server_unavailable" || c === "upstream_error") return "Google Drive가 잠깐 응답하지 않습니다.";
  return e && e.message ? String(e.message).slice(0, 200) : String(e);
}

/* ---------- Drive ---------- */
function payloadOf(r) {
  let p = r && (r.payload !== undefined ? r.payload : r.structuredContent);
  if (typeof p === "string") { try { p = JSON.parse(p); } catch {} }
  if (p === undefined && r && Array.isArray(r.content)) { const t = r.content.find((b) => b.type === "text"); if (t) { try { p = JSON.parse(t.text); } catch { p = t.text; } } }
  return p;
}
const call = async (tool, input) => payloadOf(await S.mcp.callTool(DRIVE, tool, input, { cache: false }));
const q = (s) => String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
async function search(query, pages = 2) {
  let out = [], tok;
  for (let i = 0; i < pages; i++) {
    const p = await call("search_files", { query, pageSize: 100, excludeContentSnippets: true, ...(tok ? { pageToken: tok } : {}) });
    out = out.concat((p && p.files) || []); tok = p && p.nextPageToken;
    if (!tok) break;
  }
  const seen = new Set(); return out.filter((f) => !seen.has(f.id) && seen.add(f.id));
}
function b64text(b) { const bin = atob(String(b || "").replace(/\s/g, "")), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
async function readFile(f, errs) { try { return JSON.parse(b64text((await call("download_file_content", { fileId: f.id })).content)); } catch (e) { if (errs) errs.push(`${f.title || f.id}: ${errText(e)}`); return { __bad: true }; } }
const newest = (l) => l.slice().sort((a, b) => String(b.modifiedTime).localeCompare(String(a.modifiedTime)))[0] || null;
async function sub(parent, title) { return parent ? newest(await search(`parentId = '${q(parent)}' and title = '${q(title)}' and mimeType = '${FOLDER}'`, 1)) : null; }
async function fileIn(parent, title) { return parent ? newest(await search(`parentId = '${q(parent)}' and title = '${q(title)}'`, 1)) : null; }
async function readIn(parent, title) { const f = await fileIn(parent, title); return f ? readFile(f) : null; }
async function listIn(parent, since, pages = 1) {
  if (!parent) return [];
  return (await search(`parentId = '${q(parent)}' and mimeType != '${FOLDER}'` + (since ? ` and modifiedTime > '${since}'` : ""), pages))
    .sort((a, b) => String(b.modifiedTime).localeCompare(String(a.modifiedTime)));
}
async function findTop(title) {   // 매번 찾음 — 같은 이름 폴더가 여럿이면 어느 것인지 모르므로 읽기 실패 (b18 보충)
  const l = (await search(`title = '${q(title)}' and mimeType = '${FOLDER}' and trashed = false`, 1)).filter((f) => f.title === title);
  if (l.length > 1) throw { message: `Drive에 '${title}' 폴더가 ${l.length}개 있습니다. 하나만 남기기 전에는 제어를 막습니다.` };
  return l.length ? l[0].id : null;
}

/* ---------- 읽기 ---------- */
const NAMES = { prod: ["eggplant_yolo", "eggplant_admin"], test: ["eggplant_yolo_test", "eggplant_admin_test"] };
async function loadAll() {
  const gen = ++S.gen, env = S.env, errs = [];
  const cur = () => gen === S.gen && env === S.env;        // 늦게 끝난 옛 읽기는 화면·전송 대상을 덮지 않음 (X2)
  $("#sub").textContent = "읽는 중…";
  const safe = (p, n) => p.catch((e) => { errs.push(`${n}: ${errText(e)}`); return null; });
  const rd = (f) => readFile(f, errs);
  try {
    const [rn, an] = NAMES[env];
    const root = await findTop(rn);
    if (!root) throw { message: `Drive에서 ${rn} 폴더를 찾지 못했습니다.` };
    const admin = await safe(findTop(an), an);
    const [arb, jobs, status, workers, cfg] = await Promise.all([sub(root, "arb"), sub(root, "jobs"), sub(root, "status"), sub(root, "workers"), admin ? sub(admin, "config") : null]);
    const id = (f) => f && f.id;
    const [holdsD, alertsD, recD, locksD, wdD, sigD, doneD] = await Promise.all([
      sub(id(arb), "holds"), sub(id(arb), "alerts"), sub(id(arb), "recovery"), sub(id(arb), "locks"), sub(id(jobs), "wake_done"), sub(id(jobs), "signals"), sub(id(arb), "signal_done")]);
    const dirs = { jobs: id(jobs), signals: id(sigD), env };
    const day = new Date(Date.now() - 86400e3).toISOString(), week = new Date(Date.now() - 7 * 86400e3).toISOString();
    const [A, G, K, C, P, wl, hl, al, rl, mg, trD] = await Promise.all([
      safe(readIn(id(arb), "ARBITER.json"), "ARBITER.json"), safe(readIn(id(jobs), "ARBITER_GRANT.json"), "자격 파일"),
      safe(readIn(id(jobs), "keeper.json"), "keeper.json"), safe(readIn(id(status), "collector.json"), "collector.json"),
      safe(cfg ? readIn(cfg.id, "people.json") : Promise.resolve(null), "people.json"),
      safe(listIn(id(workers), day), "workers"), safe(listIn(id(holdsD)), "holds"), safe(listIn(id(alertsD), day), "alerts"),
      safe(listIn(id(recD)), "recovery"), safe(readIn(id(locksD), "mgmt.json"), "mgmt"), safe(sub(id(locksD), "train"), "train")]);
    const [W, H, AL, TR, SG, WD, DN] = await Promise.all([
      Promise.all((wl || []).slice(0, 30).map(async (f) => ({ f, o: await rd(f) }))),
      Promise.all((hl || []).map(async (f) => ({ f, o: await rd(f) }))),
      Promise.all((al || []).slice(0, 15).map(async (f) => ({ f, o: await rd(f) }))),
      safe(trD ? listIn(trD.id).then((l) => Promise.all(l.map(async (f) => ({ f, o: await rd(f) })))) : Promise.resolve([]), "train locks"),
      safe(listIn(id(sigD), week), "signals"), safe(listIn(id(wdD), week), "wake_done"), safe(listIn(id(doneD), week), "signal_done")]);
    const doneByName = Object.fromEntries((DN || []).map((f) => [f.title.replace(/\.json$/, ""), f]));
    const wdByName = Object.fromEntries((WD || []).map((f) => [f.title.replace(/\.json$/, ""), f]));
    const mine = (SG || []).slice(0, 8);
    const mineRes = await Promise.all(mine.map(async (f) => {
      const id_ = f.title.replace(/\.json$/, ""), wake = id_.startsWith("wake__");
      const rf = wake ? wdByName[id_] : doneByName[id_];
      return { id: id_, f, res: rf ? await rd(rf) : null, wake };
    }));
    const rec = rl && rl.length ? await rd(rl[0]) : null;
    if (!cur()) return;
    // 정지 보류: 폴더 목록 실패(null)나 파일 하나라도 못 읽음 → '모름' (없음과 구분, X6)
    const holdsUnknown = hl === null || (H || []).some(({ o }) => !o || o.__bad);
    if (holdsUnknown) errs.push("정지 보류를 다 읽지 못했습니다 — 깨우기·해제를 막습니다");
    S.d = { A, G, K, C, W, H, AL, TR, mg, rec, sigs: mineRes, holdsUnknown };
    S.people = Array.isArray(P) ? P : P && Array.isArray(P.people) ? P.people : null;
    S.dirs = dirs; S.loadedEnv = env; S.dataGen = (S.dataGen || 0) + 1;
    S.at = Date.now(); S.errors = errs;
    $("#note").innerHTML = errs.length ? `<div class="band note">일부를 읽지 못했습니다 — ${errs.map(esc).join(" · ")}</div>` : "";
  } catch (e) {
    if (!cur()) return;
    S.loadedEnv = null; S.dirs = null;     // 읽기에 실패하면 다시 읽힐 때까지 제어를 막음 (옛 판단으로 보내지 않음, b18 Y5)
    $("#note").innerHTML = `<div class="band note"><b>Drive를 읽지 못했습니다</b> — ${esc(errText(e))} · 다시 읽힐 때까지 제어 버튼을 막습니다</div>`;
  }
  render();
}
const ready = () => !!S.mcp && !!S.dirs && S.loadedEnv === S.env && S.dirs.env === S.env;   // 지금 화면의 환경을 다 읽었는가 (X2)
/** 이 동작을 지금 상태로 보낼 수 있는가 — 버튼·대화상자·보내기 모두 이것으로 판단 (b18 Y5) */
function allowed(kind, arg, rel) {
  const p = person(), hs = holdsActive(), hu = !!S.d.holdsUnknown, prot = Array.isArray((S.d.A || {}).protect) && S.d.A.protect.length > 0;
  if (!ready() || !p) return false;
  const admin = p.role === "admin" && can(p, "release") && can(p, "wake");
  if (kind === "wake") {
    if (hu || !can(p, "wake") || arbiterState().alive || hs.length > 1) return false;
    if (!hs.length) return !rel;
    return admin && rel === hs[0].o.stop_id;
  }
  if (kind === "stop") return can(p, "release") && !prot;
  if (kind === "release") return !hu && can(p, "release") && !prot && hs.some(({ o }) => o.stop_id === arg);

}

/* ---------- 판정 ---------- */
function arbiterState() {
  const A = S.d.A, G = S.d.G;

  const age = now() - secOf(A.at), same = G && A.session === G.session && Number(A.epoch) === Number(G.epoch);
  const alive = same && age <= ALIVE;
  return { t: alive ? (A.protect && A.protect.length ? "ba" : "ok") : "ba", alive,
    v: alive ? (A.protect && A.protect.length ? "보호 모드" : "판정 중") : same ? "멈춤" : "자격 없음",
    s: `${ago(secOf(A.at))} · ${A.round || "?"}회차 · epoch ${A.epoch ?? "?"} · ${A.session || ""}` };

const holdsActive = () => (S.d.H || []).filter(({ o }) => o && o.active === true && (o.until == null || secOf(o.until) > now()));

/* ---------- 그리기 ---------- */
function cell(k, v, s, t) { return `<div class="cell ${t}"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${s}</div></div>`; }

  const C = S.d.C, ct = C && C.last ? secOf(C.last.time) : 0;

  // 제어
  const ps = (S.people || []).filter((p) => p && p.id);

  const p = person(), hs = holdsActive(), hu = !!S.d.holdsUnknown, rd = ready();

  $("#wake-desc").textContent = !rd ? "이 환경의 Drive를 아직 다 읽지 못해 제어를 막았습니다." : hu ? "정지 보류를 다 읽지 못해 깨우기를 막았습니다. 새로고침하세요." : a.alive ? "심판이 살아 있어 깨울 필요가 없습니다." : hs.length > 1 ? "정지 보류가 여럿이라 깨울 수 없습니다. 먼저 하나씩 해제하세요."
    : hs.length ? (admin ? "정지 보류가 있습니다. 관리자는 이 보류를 해제하면서 깨울 수 있습니다 (Keeper가 정지 번호를 다시 확인)." : "정지 보류가 있어 깨울 수 없습니다. 관리자에게 요청하세요.")
    : can(p, "wake") ? "Keeper가 1분 안에 2차 확인(만든 계정·권한·보류)을 하고 깨웁니다." : "선택한 사람에게 깨우기 권한(wake)이 없습니다.";

    `<tr><td data-l="정지 번호" class="mono">${esc(o.stop_id)}</td><td data-l="기한">${o.until ? esc(kst(secOf(o.until))) + "까지" : "해제할 때까지"}</td>
     <td><button class="btn" type="button" data-rel="${esc(o.stop_id)}" ${rd && !hu && can(p, "release") && !prot.length ? "" : "disabled"}>해제</button></td></tr>`).join("")}</tbody></table>` : "없음";
  if (hu) $("#holds").innerHTML = `<div class="band note"><b>읽지 못함</b> — 정지 보류 목록이나 파일 일부를 읽지 못했습니다. 보류가 있는지 모르므로 깨우기·해제를 막았습니다.</div>` + (hs.length ? $("#holds").innerHTML : "");

  $("#runs").innerHTML = runs.length ? `<table class="stack"><thead><tr><th>줄</th><th>상태</th><th>실행</th></tr></thead><tbody>${runs.map(([k, o]) =>
    `<tr><td data-l="줄">${esc(k)}</td><td data-l="상태">${pill(o.state, o.state === "needs_check" ? "ba" : o.state === "running" ? "wa" : "")}${o.stop_reported ? " " + pill("멈춤 보고", "ba") : ""}</td><td data-l="실행" class="mono">${esc(o.run || "")} ${esc(o.rid || "")}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">실행 잠금 없음</div>`;

    `<tr><td data-l="시각">${esc(kst(secOf(f.modifiedTime)))}</td><td data-l="종류">${pill(o.kind, /protect|duplicate|foreign|untrusted/.test(o.kind) ? "ba" : "wa")}</td><td data-l="내용" class="mono">${esc(o.path || o.why || o.session || o.ask || "")}</td></tr>`).join("")}</tbody></table>`

/* ---------- 신호 보내기 ---------- */
function stamp() { const d = new Date(Date.now() + 9 * 3600e3).toISOString().replace(/[-:T]/g, "").slice(0, 14); return d + Math.random().toString(36).slice(2, 5); }
function nextMorning() { const k = new Date(Date.now() + 9 * 3600e3); return Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate() + (k.getUTCHours() >= 8 ? 1 : 0), -1) / 1000; }
function openDlg(kind, arg) {
  const p = person(); if (!p) { toast("사람을 먼저 고르세요"); return; }
  if (!ready()) { toast("이 환경을 다 읽은 뒤에 보낼 수 있습니다"); return; }
  const hs = holdsActive(), admin = p.role === "admin";
  const rel = kind === "wake" && hs.length === 1 && admin ? hs[0].o.stop_id : null;
  if (!allowed(kind, arg, rel)) { toast("지금 상태로는 보낼 수 없습니다"); return; }
  S.act = { kind, arg, rel, env: S.env, dirs: S.dirs, gen: S.dataGen, who: p.id };
  if (kind === "wake") {
    $("#dlg-t").textContent = rel ? "보류 해제하고 깨우기" : "마스터 깨우기";
    $("#dlg-b").innerHTML = `<p>${esc(p.id)} 이름으로 <span class="mono">jobs/signals/wake__${esc(p.id)}__…</span>를 만듭니다.</p>
      ${rel ? `<p>정지 <span class="mono">${esc(rel)}</span>를 해제하면서 깨웁니다. Keeper가 지금 걸린 정지와 번호가 같은지 다시 확인합니다. 해제는 기동이 실패해도 남습니다.</p>` : ""}
      <p class="mu">Keeper가 1분 안에 2차 확인합니다: 파일을 만든 Google 계정이 이 사람의 계정인지, 권한, 10분 안인지, 심판이 정말 없는지, 정지 보류. 결과는 '보낸 신호 처리 결과'에 보입니다.</p>`;
  } else if (kind === "stop") {
    $("#dlg-t").textContent = "정지 신호";
    $("#dlg-b").innerHTML = `<p>새 배정을 멈춥니다. 확정 승인된 TASK와 이미 보낸 CVAT 작업은 끝까지 갑니다 — 정지는 TASK가 비었다는 뜻이 아닙니다.</p>
      <label class="f"><span>유지</span><select id="until"><option value="manual">'해제'를 누를 때까지</option><option value="morning">다음 08:00까지 (그 뒤 자동 해제)</option></select></label>`;
  } else {
    $("#dlg-t").textContent = "정지 해제";
    $("#dlg-b").innerHTML = `<p>정지 <span class="mono">${esc(arg)}</span>를 해제합니다. 마스터가 꺼져 있으면 Keeper가 다음 깨우기 조건에서 깨웁니다.</p>`;

}
async function send() {
  const p = person(), a = S.act; if (!p || !a) return;
  store.set("egg.ctrl.who", p.id);
  const kind = a.kind, id = `${kind}__${p.id}__${stamp()}`;
  const body = kind === "wake" ? (a.rel ? { release_stop: a.rel } : {}) : kind === "stop" ? { until: $("#until").value === "morning" ? nextMorning() : null, reason: "CTRL앱" } : { stop_id: a.arg };
  body.app = "ctrl"; body.created = new Date().toISOString();
  $("#dlg-ok").disabled = true;
  try {
    if (!ready() || a.env !== S.env || a.dirs.signals !== S.dirs.signals || S.dirs.env !== a.env) throw { message: "환경이 바뀌었거나 다시 읽는 중입니다. 대화상자를 닫고 다시 보내세요." };
    if (p.id !== a.who || !allowed(a.kind, a.arg, a.rel)) throw { message: "지금 상태로는 보낼 수 없습니다 (보류·보호 모드·권한·심판 상태가 바뀜). 화면을 확인하세요." };
    if (!S.dirs.signals) throw { message: "jobs/signals 폴더를 찾지 못했습니다." };
    await call("create_file", { title: id + ".json", parentId: a.dirs.signals, textContent: JSON.stringify(body), contentMimeType: "application/json", disableConversionToGoogleType: true });
    $("#dlg").close(); toast(`보냈습니다: ${id}`); setTimeout(loadAll, 2000);
  } catch (e) {
    $("#dlg-ok").disabled = false;
    toast(e && (e.code === "server_unavailable" || e.code === "upstream_error") ? "Drive가 응답하지 않았습니다. 파일이 만들어졌을 수 있으니 새로고침해 확인한 뒤 다시 보내세요." : errText(e), 8000);
  }
}

/* ---------- 시작 ---------- */
function setEnv(e) {     // 환경을 바꾸면 이전 환경의 전송 대상·사람·대화상자를 모두 버림 (X2)
  S.env = e; store.set("egg.ctrl.env", e); S.gen++;
  S.d = {}; S.dirs = null; S.people = null; S.at = 0; S.loadedEnv = null; S.act = null; S.errors = [];
  if ($("#dlg").open) $("#dlg").close();
  $("#note").innerHTML = ""; render(); if (S.mcp) loadAll();
}
$("#env-prod").onclick = () => setEnv("prod"); $("#env-test").onclick = () => setEnv("test");
$("#reload").onclick = () => loadAll();
$("#act-wake").onclick = () => openDlg("wake"); $("#act-stop").onclick = () => openDlg("stop");
$("#who").onchange = () => { store.set("egg.ctrl.who", $("#who").value); render(); };
$("#dlg-no").onclick = () => $("#dlg").close(); $("#dlg-ok").onclick = () => send();
S.env = store.get("egg.ctrl.env", "prod") === "test" ? "test" : "prod";
render();
(async () => {
  try { S.mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch { S.mcp = null; }
  if (!S.mcp) { $("#note").innerHTML = `<div class="band note"><b>이 보기에서는 Google Drive를 쓸 수 없습니다</b> — claude.ai에서 이 페이지를 직접 열고, Google Drive 커넥터가 연결되어 있는지 확인하세요.</div>`; render(); return; }
  await loadAll();
  setInterval(() => { if (!document.hidden) loadAll(); }, 60000);
})();
}
